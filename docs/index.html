<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>選股晨報</title>
<meta name="description" content="台股技術面選股晨報：今日新增、可買入上限、持股與出場線、歷史晨報、測試名單">
<meta name="theme-color" content="#1b1f24" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="晨報">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="title-row">
      <span class="brand">選股晨報</span>
      <button type="button" id="refresh" class="iconbtn" aria-label="重新整理" title="重新整理"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
    </div>
    <h1 id="dateline" class="dateline">載入中…</h1>
    <div id="mkt" class="mkt" hidden></div>
    <p id="stale" class="banner" hidden></p>
  </div>
</header>

<main class="wrap">
  <section id="tab-today" class="tab" data-tab="today"></section>
  <section id="tab-live" class="tab" data-tab="live" hidden></section>
  <section id="tab-pool" class="tab" data-tab="pool" hidden></section>
  <section id="tab-history" class="tab" data-tab="history" hidden></section>
  <section id="tab-lab" class="tab" data-tab="lab" hidden></section>
  <p class="disclaimer">技術面整理，不構成投資建議。資料來源：證交所、櫃買中心、FinMind。</p>
</main>

<nav class="tabbar" aria-label="主要分頁">
  <button type="button" class="tabbtn active" data-go="today"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>今日</button>
  <button type="button" class="tabbtn" data-go="live"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg>盤中</button>
  <button type="button" class="tabbtn" data-go="pool"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>持股</button>
  <button type="button" class="tabbtn" data-go="history"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>歷史</button>
  <button type="button" class="tabbtn" data-go="lab"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/><path d="M7 15h10"/></svg>測試</button>
</nav>

<section id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vtitle">
  <div class="vbar"><div class="vhead"><b id="vtitle">晨報</b><span id="vstat" class="am"></span></div><button type="button" id="vclose">關閉</button></div>
  <p id="vwarn" hidden></p>
  <div id="vpages"></div>
</section>

<section id="chart" hidden role="dialog" aria-modal="true" aria-labelledby="ctitle">
  <div class="cbar"><div><b id="ctitle">K 線</b><div id="csub" class="am"></div></div><button type="button" id="cclose">關閉</button></div>
  <div class="cranges"><button type="button" data-range="60">3 個月</button><button type="button" data-range="120" class="active">6 個月</button><button type="button" data-range="180">9 個月</button></div>
  <div class="cwrap"><canvas id="ccanvas"></canvas></div>
  <div id="clegend" class="clegend"></div>
  <p class="note">日K為除權息還原價，最右邊一根在盤中會用即時報價累積（延遲約 5–10 分），收盤後就是當天的日K。虛線為可買入上限、停損（趨勢線）與進場價；下方為 KD(9,3,3) 與 MACD(12,26,9)。手指滑過 K 棒可看當日數值。</p>
</section>

<div id="install" class="installtip" hidden>
  <b>加到主畫面就是 app</b>
  <span id="installhow"></span>
  <button type="button" id="installbtn" hidden>安裝</button>
  <button type="button" id="installclose" class="iconbtn" aria-label="關閉">×</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="app.js?v=4" defer></script>
</body>
</html>
