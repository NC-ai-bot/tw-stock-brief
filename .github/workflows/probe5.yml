name: probe5
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          NOW=$(date +%s); for R in 15 60; do echo "=== res $R"; curl -sS -m 20 -A Mozilla/5.0 "https://ws.api.cnyes.com/ws/api/v1/charting/history?symbol=TWF:TXF:FUT&resolution=$R&from=$NOW&to=$((NOW-864000))" | python3 -c "
          import json,sys,datetime;d=json.load(sys.stdin)['data'];t=sorted(d['t']);print('n',len(t),'first',datetime.datetime.fromtimestamp(t[0]+28800,datetime.UTC),'last',datetime.datetime.fromtimestamp(t[-1]+28800,datetime.UTC))
          ix={x:i for i,x in enumerate(d['t'])}
          for x in t:
            te=datetime.datetime.fromtimestamp(x+28800+int(sys.argv[1]),datetime.UTC)
            if te.strftime('%H:%M') in ('13:45','13:30','13:00') : print(te.strftime('%m-%d %H:%M'), d['c'][ix[x]])" $((R*60)); done
