name: probe_cors
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          NOW=$(date +%s)
          for U in "https://ws.api.cnyes.com/ws/api/v1/charting/history?symbol=TWF:TXF:FUT&resolution=1&from=$NOW&to=$((NOW-600))" "https://tw.stock.yahoo.com/_td-stock/api/resource/StockServices.stockList;symbols=WTX%26?bkt=&device=desktop&lang=zh-TW&region=TW" "https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw&json=1&delay=0"; do
            echo "=== $U"; curl -sS -m 20 -D - -o /dev/null -H 'Origin: https://nc-ai-bot.github.io' -H 'User-Agent: Mozilla/5.0' "$U" | grep -iE '^HTTP|access-control|content-type' ; done
