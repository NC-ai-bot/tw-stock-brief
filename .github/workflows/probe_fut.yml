name: probe_fut
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          echo "=== yahoo stockList full"; curl -sS -m 20 -A "$UA" 'https://tw.stock.yahoo.com/_td-stock/api/resource/StockServices.stockList;symbols=WTX%26,WTXP%26,WTXM%26,WTXAFE%26?bkt=&device=desktop&lang=zh-TW&region=TW' | python3 -c "import json,sys;d=json.load(sys.stdin);[print(json.dumps(x,ensure_ascii=False)) for x in d]"
          echo; echo "=== cnyes history quote fields"; NOW=$(date +%s); curl -sS -m 20 -A "$UA" "https://ws.api.cnyes.com/ws/api/v1/charting/history?symbol=TWF:TXF:FUT&resolution=1&quote=1&from=$NOW&to=$((NOW-7200))" | python3 -c "
          import json,sys,datetime;d=json.load(sys.stdin)['data'];print('keys',list(d.keys()));print('quote',json.dumps(d.get('quote'),ensure_ascii=False)[:1500]);t=d['t'];print('n',len(t),'first',datetime.datetime.utcfromtimestamp(min(t)),'last',datetime.datetime.utcfromtimestamp(max(t)));i=t.index(max(t));print('last bar',[d[k][i] for k in 'ohlcv'])"
          echo; echo "=== cnyes history day range (36h)"; curl -sS -m 20 -A "$UA" "https://ws.api.cnyes.com/ws/api/v1/charting/history?symbol=TWF:TXF:FUT&resolution=1&from=$NOW&to=$((NOW-129600))" | python3 -c "
          import json,sys,datetime;d=json.load(sys.stdin)['data'];t=sorted(d['t']);print('n',len(t));import collections;c=collections.Counter(datetime.datetime.utcfromtimestamp(x+28800).strftime('%m-%d %H') for x in t);print(sorted(c.items()))"
          echo; echo "=== cnyes MTX"; curl -sS -m 20 -A "$UA" "https://ws.api.cnyes.com/ws/api/v1/charting/history?symbol=TWF:MTX:FUT&resolution=1&quote=1&from=$NOW&to=$((NOW-3600))" | head -c 300; echo
          echo "=== cnyes TXF via cloudflare-ish headers (cf-worker)"; curl -sS -m 20 -o /dev/null -w 'HTTP %{http_code}\n' -H 'cf-worker: tw-quotes.workers.dev' "https://ws.api.cnyes.com/ws/api/v1/charting/history?symbol=TWF:TXF:FUT&resolution=1&from=$NOW&to=$((NOW-600))"
          echo "=== yahoo via cf-worker header"; curl -sS -m 20 -o /dev/null -w 'HTTP %{http_code}\n' -H 'cf-worker: tw-quotes.workers.dev' 'https://tw.stock.yahoo.com/_td-stock/api/resource/StockServices.stockList;symbols=WTX%26?bkt=&device=desktop&lang=zh-TW&region=TW'
