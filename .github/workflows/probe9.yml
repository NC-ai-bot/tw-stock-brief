name: probe9
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          NOW=$(date +%s)
          echo "== charting quote=1"; curl -s -m 20 "https://ws.api.cnyes.com/ws/api/v1/charting/history?symbol=TWF:TXF:FUT&resolution=D&quote=1&from=$NOW&to=$((NOW-864000))" | head -c 1500; echo
          echo "== quotes"; curl -s -m 20 -D h.txt "https://ws.api.cnyes.com/ws/api/v1/quote/quotes/TWF:TXF:FUT" | head -c 2500; echo; grep -i "access-control" h.txt
          echo "== pages"; curl -s -m 20 -o /dev/null -w '%{http_code}\n' https://nc-ai-bot.github.io/tw-stock-brief/data/fut/20261116.json; curl -s -m 20 https://nc-ai-bot.github.io/tw-stock-brief/data/fut/last.json | head -c 120; echo; curl -s -m 20 https://nc-ai-bot.github.io/tw-stock-brief/data/weights.json | head -c 40
