name: probe6
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          NOW=$(date +%s)
          for S in GI:DJI:INDEX GI:SP500:INDEX GI:IXIC:INDEX GI:SOX:INDEX GI:INX:INDEX GI:SPX:INDEX; do for R in 5 D; do echo "=== $S $R"; curl -sS -m 20 -A Mozilla/5.0 -D /tmp/h -H 'Origin: https://nc-ai-bot.github.io' "https://ws.api.cnyes.com/ws/api/v1/charting/history?symbol=$S&resolution=$R&quote=1&from=$NOW&to=$((NOW-86400*6))" | python3 -c "
          import json,sys,datetime;j=json.load(sys.stdin);d=j.get('data') or {};t=d.get('t') or []
          if not t: print('EMPTY',json.dumps(j,ensure_ascii=False)[:150]); sys.exit()
          ix=sorted(range(len(t)),key=lambda i:t[i]);f=lambda x:datetime.datetime.fromtimestamp(x,datetime.UTC).strftime('%m-%d %H:%M')
          print('n',len(t),'first',f(t[ix[0]]),'last',f(t[ix[-1]]),'lastc',d['c'][ix[-1]],'prevc',d['c'][ix[-2]])
          print('quote',json.dumps(d.get('quote'),ensure_ascii=False)[:700])" || true; grep -i access-control-allow-origin /tmp/h || echo NO-CORS; done; done
